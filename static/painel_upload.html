<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload de Imagem - Análise de Resíduos</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        /* Estilos específicos para o painel de upload, pode ir para styles.css depois */
        body {
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center; /* Centraliza verticalmente o conteúdo principal */
            align-items: center; /* Centraliza horizontalmente o conteúdo principal */
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: flex-start; /* Alinha o conteúdo ao topo do container */
        }

        header {
            width: 100%; /* Garante que o header ocupe a largura total */
            margin-bottom: 20px; /* Adiciona um espaço abaixo do header */
        }

        main {
            flex-grow: 1; /* Permite que o main ocupe o espaço restante */
            display: flex;
            justify-content: center;
            align-items: center; /* Centraliza o painel de upload na tela */
            width: 100%;
        }

        .upload-panel {
            background-color: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 600px;
            /* Removido margin: 50px auto; pois o main está centralizando */
        }

        .upload-panel h2 {
            color: #333;
            margin-bottom: 25px;
            font-size: 2em;
        }

        .drop-area {
            border: 3px dashed #ccc;
            border-radius: 8px;
            padding: 20px; /* Reduzido um pouco para a pré-visualização */
            margin-bottom: 20px; /* Reduzido um pouco */
            cursor: pointer;
            transition: border-color 0.3s ease, background-color 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            overflow: hidden; /* Garante que a imagem não transborde */
            position: relative; /* Para posicionar a imagem ou vídeo */
        }

        .drop-area.highlight {
            border-color: #00a0e4;
            background-color: #e8f4fd;
        }

        .drop-area p {
            color: #777;
            font-size: 1.1em;
            margin-top: 15px;
            z-index: 1; /* Garante que o texto fique acima da imagem */
            background-color: rgba(255, 255, 255, 0.7); /* Fundo semi-transparente para o texto sobre a imagem */
            padding: 5px 10px;
            border-radius: 5px;
        }

        /* Estilo para a pré-visualização da imagem/vídeo */
        .preview-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.1); /* Um leve fundo enquanto carrega */
            overflow: hidden;
        }

        .preview-container img,
        .preview-container video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* Ajusta a imagem/vídeo dentro do container */
            border-radius: 8px; /* Mantém as bordas arredondadas */
        }


        .drop-area input[type="file"] {
            display: none; /* Esconde o input de arquivo padrão */
        }

        .upload-button {
            background-color: #0088cc;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 100%; /* Botão ocupa a largura total do painel */
            max-width: 300px; /* Limita a largura máxima do botão */
        }

        .upload-button:hover {
            background-color: #006bb3;
        }

        #file-name {
            margin-top: 15px;
            font-style: italic;
            color: #555;
            z-index: 1; /* Garante que o nome do arquivo também fique acima */
            background-color: rgba(255, 255, 255, 0.7);
            padding: 3px 8px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <img src="/static/logo.png" alt="TPF Logo">
            </div>
            <nav>
                <ul>
                    <li><a href="/painel_upload" class="nav-link active">PAINEL DE UPLOAD</a></li>
                    <li><a href="/painel_espera" class="nav-link">PAINEL DE ESPERA</a></li>
                    <li><a href="/painel_resultado" class="nav-link">PAINEL DE RESULTADO</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <div class="upload-panel">
                <h2>Faça o Upload da Imagem ou Vídeo</h2>
                <div class="drop-area" id="dropArea">
                    <div class="preview-container" id="previewContainer"></div> 
                    <p id="dropText">Arraste e solte seu arquivo aqui ou clique para selecionar</p>
                    <input type="file" id="fileInput" accept="image/*,video/*">
                    <p id="file-name"></p>
                </div>
                <button class="upload-button" id="uploadButton">Processar Arquivo</button>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const dropArea = document.getElementById('dropArea');
            const fileInput = document.getElementById('fileInput');
            const fileNameDisplay = document.getElementById('file-name');
            const uploadButton = document.getElementById('uploadButton');
            const previewContainer = document.getElementById('previewContainer'); // Novo elemento
            const dropText = document.getElementById('dropText'); // Texto da área de drop
            let selectedFile = null;

            // Previne o comportamento padrão de abrir o arquivo quando arrastado
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, preventDefaults, false);
                document.body.addEventListener(eventName, preventDefaults, false);
            });

            function preventDefaults (e) {
                e.preventDefault();
                e.stopPropagation();
            }

            // Destaca a área de drop ao arrastar o arquivo
            ['dragenter', 'dragover'].forEach(eventName => {
                dropArea.addEventListener(eventName, highlight, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, unhighlight, false);
            });

            function highlight() {
                dropArea.classList.add('highlight');
            }

            function unhighlight() {
                dropArea.classList.remove('highlight');
            }

            // Lidar com o drop do arquivo
            dropArea.addEventListener('drop', handleDrop, false);

            function handleDrop(e) {
                const dt = e.dataTransfer;
                const files = dt.files;
                handleFiles(files);
            }

            // Lidar com a seleção de arquivo ao clicar
            dropArea.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', (e) => {
                handleFiles(e.target.files);
            });

            function handleFiles(files) {
                if (files.length > 0) {
                    selectedFile = files[0];
                    fileNameDisplay.textContent = `Arquivo selecionado: ${selectedFile.name}`;
                    uploadButton.disabled = false; // Habilita o botão após seleção

                    // Lógica para pré-visualização
                    const fileReader = new FileReader();
                    fileReader.onload = function(event) {
                        previewContainer.innerHTML = ''; // Limpa qualquer pré-visualização anterior
                        if (selectedFile.type.startsWith('image/')) {
                            const img = document.createElement('img');
                            img.src = event.target.result;
                            img.alt = 'Pré-visualização da imagem';
                            previewContainer.appendChild(img);
                        } else if (selectedFile.type.startsWith('video/')) {
                            const video = document.createElement('video');
                            video.src = event.target.result;
                            video.controls = true; // Adiciona controles de vídeo
                            video.muted = true; // Inicia mutado
                            video.loop = true; // Faz loop
                            video.autoplay = true; // Tenta autoplay
                            video.setAttribute('playsinline', ''); // Para iOS
                            previewContainer.appendChild(video);
                        }
                        dropText.style.display = 'none'; // Esconde o texto "Arrasta e solte..."
                    };
                    fileReader.readAsDataURL(selectedFile); // Lê o arquivo como URL de dados
                } else {
                    selectedFile = null;
                    fileNameDisplay.textContent = '';
                    uploadButton.disabled = true; // Desabilita se nenhum arquivo
                    previewContainer.innerHTML = ''; // Limpa a pré-visualização
                    dropText.style.display = 'block'; // Mostra o texto "Arrasta e solte..."
                }
            }

            // Lidar com o clique do botão de upload
            uploadButton.addEventListener('click', async () => { 
                if (selectedFile) {
                    const formData = new FormData();
                    formData.append('file', selectedFile);

                    try {
                        const response = await fetch('/api/upload-image', { // Endpoint da API para upload
                            method: 'POST',
                            body: formData
                        });

                        if (response.ok) {
                            const data = await response.json();
                            const processingId = data.processing_id; 
                            window.location.href = `/painel-espera?id=${processingId}`; // Redireciona para a página de espera
                        } else {
                            const errorData = await response.json();
                            alert(`Erro no upload: ${errorData.detail || 'Ocorreu um erro desconhecido.'}`);
                            console.error('Erro no upload:', errorData);
                        }
                    } catch (error) {
                        alert('Falha na comunicação com o servidor.');
                        console.error('Erro de rede:', error);
                    }
                } else {
                    alert('Por favor, selecione um arquivo para upload.');
                }
            });

            // Inicialmente, desabilita o botão se nenhum arquivo for selecionado
            uploadButton.disabled = true; 
        });
    </script>
</body>
</html>
