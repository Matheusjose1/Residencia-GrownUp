<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Resultado</title>
    <link rel="stylesheet" href="/static/styles/resultado.css">
    <link rel="stylesheet" href="/static/styles/carrossel.css"> </head>
<body>

    <header>
        <div class="container">
            <div class="logo">
                <img src="/static/images/logo.png" alt="TPF Logo">
            </div>
            <nav>
                <ul>
                    <li><a href="/static/painel_upload.html" class="active">PAINEL DE UPLOAD</a></li>
                    <li><a href="/static/painel_espera.html">PAINEL DE ESPERA</a></li>
                    <li><a href="/static/painel_resultado.html">PAINEL DE RESULTADO</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <h2>Arquivo processado<span class="icon-check"><img src="/static/images/iconcorrect.svg" alt=""></span></h2>

        <div class="carrossel-container" id="carrosselContainer"> <button class="carrossel-btn prev-btn">&lt;</button>
            <ul class="carrossel" id="carrosselImages"> </ul>
            <button class="carrossel-btn next-btn">&gt;</button>
        </div>

        <div class="result-details">
            <div class="diagnostico">
                <h2>ID: <span id="processingId"></span></h2>      <h2>Tipo: <span id="mainObjectType"></span></h2>   <h2>Data: <span id="processingDate"></span></h2>   </div>
            <div id="resultsContent">
                </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 TPF Engenharia. Todos os direitos reservados.</p>
    </footer>

    <script src="/static/scripts/script_resultado.js"></script> <script src="/static/scripts/processing_api.js"></script> </body>
</html>
