<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Resultado</title>
    <link rel="stylesheet" href="/static/styles/resultado.css">
    <link rel="stylesheet" href="/static/styles/carrossel.css"> </head>
<body>

    <header>
        <div class="container">
            <div class="logo">
                <img src="/static/images/logo.png" alt="TPF Logo">
            </div>
            <nav>
                <ul>
                    <li><a href="/painel_upload" class="active">PAINEL DE UPLOAD</a></li>
                    <li><a href="/painel_espera">PAINEL DE ESPERA</a></li>
                    <li><a href="/painel_resultados">PAINEL DE RESULTADO</a></li> </ul>
            </nav>
        </div>
    </header>

    <main>
        <h2>Arquivo processado<span class="icon-check"><img src="/static/images/iconcorrect.svg" alt=""></span></h2>

        <div class="carrossel-container">
            <button class="carrossel-btn prev-btn">&lt;</button>
            <ul class="carrossel" id="originalImagesCarrossel">
                </ul>
            <button class="carrossel-btn next-btn">&gt;</button>
        </div>

        <div class="result-details">
            <div class="diagnostico">
                <h2>ID: <span id="resultIdDisplay">#2698473</span></h2>
                <h2>Tipo: <span id="resultTypeDisplay">Volumoso</span></h2>
                <h2>Data: <span id="resultDateDisplay">27/05/2025</span></h2>
                <h2>Precisão do modelo: <span id="modelAccuracyDisplay">60%</span></h2>
            </div>
            
            <div class="buttons">
                <button class="btn btn-blue" id="downloadZipButton">Baixar arquivo (ZIP)</button>
                <button class="btn btn-gray" onclick="window.location.href='/painel_upload'">Criar novo<span><img src="/static/images/plus.svg" alt=""></span></button>
            </div>
        </div>
    </main>

    <footer></footer>
    <script src="/static/scripts/script_resultado.js"></script>
    <script src="/static/scripts/carrossel.js"></script> </body>
</html>
